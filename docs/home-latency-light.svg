<title id="t">Home latency over time: router vs internet</title>
<desc id="d">Latency every 5 minutes from Oct 07 14:47 to Oct 09 00:45. The router stays near a few milliseconds throughout; latency to the internet alternates between about 25 ms and multi-hour plateaus near 200 ms.</desc>
