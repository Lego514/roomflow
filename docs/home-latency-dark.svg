<text x="56" y="30" font-size="16" font-weight="600" fill="#ffffff">Inside the home it's fast; the delay is on the line outside</text>
<text x="56" y="52" font-size="12.5" fill="#c3c2b7">Median latency every 5 minutes · 330 checks, Oct 07 14:47 to Oct 08 20:05 · capped at 300 ms</text>
